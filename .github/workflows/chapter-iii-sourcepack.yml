name: Chapter III official trailer assets
on:
  push:
    branches: ['media/chapter-iii-sourcepack']
    paths: ['.github/workflows/chapter-iii-sourcepack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    if: github.ref == 'refs/heads/media/chapter-iii-sourcepack'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download only the press-kit Trailer subfolders
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip ffmpeg
          mkdir -p ChapterIII_Official_Trailers/{Astraeos_Heaven_Abyss,Astraeos_Mega_Update}
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 --max-filesize 2000000000 -A 'Mozilla/5.0' 'https://www.dropbox.com/scl/fo/si5q3wva0tkn38fm2oslv/ANTgjeu014P3rYMDG5WOIq4/Trailer?rlkey=fz35z7tvnqppxdx8b89y4l8h7&dl=1' -o /tmp/astraeos_heaven.zip
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 --max-filesize 2000000000 -A 'Mozilla/5.0' 'https://www.dropbox.com/scl/fo/noqpi9macywaku3r783wh/AMtC9gh8Js1c2LTjexSKckg/Trailer?rlkey=xhaypm1tp64hzphz51s7lqrl9&dl=1' -o /tmp/astraeos_mega.zip
          echo '--- HEAVEN / ABYSS ---'
          unzip -l /tmp/astraeos_heaven.zip | tail -n 30
          echo '--- MEGA UPDATE ---'
          unzip -l /tmp/astraeos_mega.zip | tail -n 30
          unzip -oq /tmp/astraeos_heaven.zip -d ChapterIII_Official_Trailers/Astraeos_Heaven_Abyss
          unzip -oq /tmp/astraeos_mega.zip -d ChapterIII_Official_Trailers/Astraeos_Mega_Update
          find ChapterIII_Official_Trailers -type f -printf '%p %s bytes\n'
      - name: Upload high-resolution original trailer assets
        uses: actions/upload-artifact@v4
        with:
          name: ChapterIII_Official_Trailers
          path: ChapterIII_Official_Trailers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
