name: Diagnose Dropbox original video download
on:
  push:
    branches: ['media/chapter-iii-sourcepack']
    paths: ['.github/workflows/chapter-iii-sourcepack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/media/chapter-iii-sourcepack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect original video download responses
        shell: bash
        run: |
          set +e
          mkdir -p debug
          A='https://www.dropbox.com/scl/fo/si5q3wva0tkn38fm2oslv/AEEnE_N8aYMsLvMuiiHcP7s/Trailer/Astraeos_Complete_Trailer.mp4?rlkey=fz35z7tvnqppxdx8b89y4l8h7&dl=1'
          B='https://www.dropbox.com/scl/fo/noqpi9macywaku3r783wh/AGLhffAjveEJDVsi83scvKg/Trailer/Astraeos_MegaUpdate_Launch%20Trailer.mp4?rlkey=xhaypm1tpnqppxdx8b89y4l8h7&dl=1'
          curl -sSIL -A 'Mozilla/5.0' "$A" > debug/a_headers.txt
          curl -sSL -A 'Mozilla/5.0' --max-filesize 1000000 "$A" -o debug/a_body.bin 2>debug/a_error.txt
          curl -sSIL -A 'Mozilla/5.0' "$B" > debug/b_headers.txt
          curl -sSL -A 'Mozilla/5.0' --max-filesize 1000000 "$B" -o debug/b_body.bin 2>debug/b_error.txt
          C='https://www.dropbox.com/scl/fo/si5q3wva0tkn38fm2oslv/AEEnE_N8aYMsLvMuiiHcP7s/Trailer/Astraeos_Complete_Trailer.mp4?rlkey=fz35z7tvnqppxdx8b89y4l8h7&dl=0'
          curl -fsSL -A 'Mozilla/5.0' "$C" -o debug/a_preview.html
          python3 - <<'PY'
          import pathlib,re
          for p in pathlib.Path("debug").iterdir():
              print("\n###",p.name,"size",p.stat().st_size)
              if p.suffix==".txt" or p.name.endswith(".bin"):
                  print(p.read_bytes()[:4000].decode("utf8","replace"))
              elif p.suffix==".html":
                  s=p.read_text(errors="ignore")
                  for term in ["previews.dropboxusercontent.com","video","mp4","m3u8","raw=1","download_url","media_url"]:
                      print("TERM",term,"COUNT",s.lower().count(term.lower()))
                  for m in re.findall(r'https?[^"\\s<>]{0,500}(?:mp4|m3u8|webm)[^"\\s<>]{0,200}',s,re.I): print("MEDIA",m[:1000])
          PY
      - name: Upload Dropbox response diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ChapterIII_Dropbox_Download_Diagnostics
          path: debug/
          retention-days: 7
