name: Find official ARK franchise press-kit links
on:
  push:
    branches: ['media/chapter-iii-sourcepack']
    paths: ['.github/workflows/chapter-iii-sourcepack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/media/chapter-iii-sourcepack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find official media asset links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p press
          curl -fL -A 'Mozilla/5.0' 'https://www.gamespress.com/en-US/ARK-FRANCHISE-REVEALS-AT-IGN-LIVE-2026' -o press/ark_franchise.html
          curl -fL -A 'Mozilla/5.0' 'https://www.gamespress.com/nl/ARK-SURVIVAL-ASCENDED-EXPANDS-TO-THE-SEA-AND-SKY-WITH-TIDES-OF-FORTUNE' -o press/tides_press.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.title=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      a=dict(attrs)
                      if a.get("href"): self.links.append((a["href"],a.get("title","")))
              def handle_data(self,data):
                  d=data.strip()
                  if d: self.title.append(d)
          for p in Path("press").glob("*.html"):
              h=P();h.feed(p.read_text(errors="ignore"))
              print("\n###",p.name)
              for u,t in h.links:
                  if any(x in (u+" "+t).lower() for x in ["dropbox","media","asset","trailer","download","presskit"]):
                      print(u,"TITLE",t)
          PY
      - name: Upload press pages for review
        uses: actions/upload-artifact@v4
        with:
          name: ChapterIII_Official_PressLinks
          path: press/
          retention-days: 7
