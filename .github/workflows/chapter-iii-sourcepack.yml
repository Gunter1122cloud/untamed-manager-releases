name: Inspect individual ARK trailer files
on:
  push:
    branches: ['media/chapter-iii-sourcepack']
    paths: ['.github/workflows/chapter-iii-sourcepack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/media/chapter-iii-sourcepack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch trailer subfolder manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug
          curl -fL -A 'Mozilla/5.0' 'https://www.dropbox.com/scl/fo/si5q3wva0tkn38fm2oslv/ANTgjeu014P3rYMDG5WOIq4/Trailer?rlkey=fz35z7tvnqppxdx8b89y4l8h7&dl=0' -o debug/astraeos_trailer.html
          curl -fL -A 'Mozilla/5.0' 'https://www.dropbox.com/scl/fo/noqpi9macywaku3r783wh/AMtC9gh8Js1c2LTjexSKckg/Trailer?rlkey=xhaypm1tp64hzphz51s7lqrl9&dl=0' -o debug/mega_trailer.html
          python3 - <<'PY'
          import pathlib,re,base64
          for p in pathlib.Path("debug").glob("*.html"):
              s=p.read_text(errors="ignore")
              print("\n###",p.name,"bytes",len(s))
              out=[]
              for m in re.finditer(r'registerStreamedPrefetch\("([^"]+)",\s*"([^"]+)"',s):
                  key=base64.b64decode(m.group(1)+"===")
                  if b"SharedContentLinkFolderEntriesPropsPrefetch" not in key: continue
                  payload=base64.b64decode(m.group(2)+"===")
                  txt=payload.decode("latin1","replace")
                  out.append(txt)
                  print("PAYLOAD_BYTES",len(payload))
                  for hit in re.findall(r"[ -~]{5,}",txt):
                      if any(x in hit.lower() for x in ["dropbox.com","mp4","mov","webm","m4v","trailer","video","1080","4k"]):
                          print(hit[:800])
              (p.parent/(p.stem+"_entries.txt")).write_text("\n\n".join(out),encoding="utf-8")
              if not out: print("NO FOLDER ENTRIES PREFETCH FOUND")
          PY
      - name: Upload trailer manifests
        uses: actions/upload-artifact@v4
        with:
          name: ChapterIII_Trailer_Manifests
          path: debug/
          retention-days: 7
