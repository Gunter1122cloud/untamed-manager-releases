name: Discord operation feed fixtures
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'integrations/discord-operation-feed*'
      - '.github/workflows/discord-operation-feed.yml'
permissions:
  contents: read
jobs:
  isolated-node-fixtures:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/discord-operation-feed.test.mjs
