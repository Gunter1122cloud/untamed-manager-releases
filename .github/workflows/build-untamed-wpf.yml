name: Untamed Manager WPF Windows Build
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tag containing UntamedManager-WPF-v1.0.1-SOURCE.zip"
        required: true
        default: "wpf-source-v1.0.1"
permissions:
  contents: write
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'wpf-source-') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download WPF source ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.source_tag || github.event.release.tag_name }}
        run: |
          New-Item -ItemType Directory -Force source-archive | Out-Null
          gh release download "$env:SOURCE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "UntamedManager-WPF-v1.0.1-SOURCE.zip" --dir source-archive
          if ($LASTEXITCODE -ne 0) { throw "Source ZIP missing in release $env:SOURCE_TAG" }
          Expand-Archive -Path "source-archive/UntamedManager-WPF-v1.0.1-SOURCE.zip" -DestinationPath "source-code" -Force
          $project = Get-ChildItem source-code -Filter UntamedManager.csproj -Recurse | Select-Object -First 1
          if (-not $project) { throw "UntamedManager.csproj missing" }
          "PROJECT_PATH=$($project.FullName)" >> $env:GITHUB_ENV
      - name: Compile real Windows WPF EXE
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT_PATH" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o "$env:GITHUB_WORKSPACE/dist" --nologo
          if ($LASTEXITCODE -ne 0) { throw "WPF build failed" }
          if (!(Test-Path "dist/UntamedManager.exe")) { throw "Windows EXE missing" }
          Get-FileHash "dist/UntamedManager.exe" -Algorithm SHA256
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.0.1-win-x64
          path: dist/UntamedManager.exe
          if-no-files-found: error
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.1-wpf-preview.1"
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.0.1.exe" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.0.1.exe" --target "$env:GITHUB_SHA" --title "Untamed Manager WPF v1.0.1 - Windows preview" --prerelease --notes "Offline Windows WPF preview for isolated test PC. No production host agents or Kova Store write support." --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
