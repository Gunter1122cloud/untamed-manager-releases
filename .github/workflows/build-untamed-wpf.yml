name: Untamed Manager WPF Windows Build
on:
  push:
    branches: [main]
    paths:
      - 'wpf/**'
      - '.github/workflows/build-untamed-wpf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out WPF source
        uses: actions/checkout@v4
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check source files
        shell: pwsh
        run: |
          if (!(Test-Path 'wpf/UntamedManager.csproj')) { throw "Missing WPF project" }
          if (!(Test-Path 'wpf/MainWindow.xaml')) { throw "Missing window" }
          if (!(Test-Path 'wpf/MainWindow.xaml.cs')) { throw "Missing codebehind" }
      - name: Compile WPF for Windows x64
        shell: pwsh
        run: |
          dotnet publish wpf/UntamedManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist --nologo
          if ($LASTEXITCODE -ne 0) { throw "WPF publish failed" }
          if (!(Test-Path "dist/UntamedManager.exe")) { throw "EXE not produced" }
          Get-Item "dist/UntamedManager.exe" | Select-Object Name,Length
          Get-FileHash "dist/UntamedManager.exe" -Algorithm SHA256
      - name: Save Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.0.1-windows-x64
          path: dist/UntamedManager.exe
          if-no-files-found: error
      - name: Create test-only GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.1-wpf-preview.1"
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.0.1.exe" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.0.1.exe" --target "$env:GITHUB_SHA" --title "Untamed Manager WPF v1.0.1 - Test PC Preview" --prerelease --notes "Isolated Windows WPF desktop preview. No host agent installed. No live Kova Store writes. Test on a third Windows PC only." --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
