name: Untamed Manager WPF Windows Build
on:
  push:
    branches: [main]
    paths:
      - 'wpf/**'
      - '.github/workflows/build-untamed-wpf.yml'
  workflow_dispatch:
concurrency:
  group: untamed-wpf-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out WPF source
        uses: actions/checkout@v4
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore checked-in T-Rex artwork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force wpf/Assets | Out-Null
          $json = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/21f8154d985845935a30bac3a33914ab7c449575" | ConvertFrom-Json
          if ($json.encoding -ne "base64") { throw "Image blob not base64" }
          [IO.File]::WriteAllBytes("wpf/Assets/kingdom-hero.jpg",[Convert]::FromBase64String(($json.content -replace '\s','')))
          if ((Get-Item "wpf/Assets/kingdom-hero.jpg").Length -lt 1000) { throw "Image incomplete" }
          $atlas = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/0e482cc9b6389908588d11846789ec8fbd434320" | ConvertFrom-Json
          if ($atlas.encoding -ne "base64") { throw "Map atlas blob invalid" }
          [IO.File]::WriteAllBytes("wpf/Assets/map-atlas.jpg",[Convert]::FromBase64String(($atlas.content -replace '\s','')))
          if ((Get-Item "wpf/Assets/map-atlas.jpg").Length -lt 3000) { throw "Map atlas incomplete" }
          $ico=gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/7d6fa69a40eac8b7cf343e0f39223d776d4131c2" | ConvertFrom-Json
          if ($ico.encoding -ne "base64") { throw "Icon blob invalid" }
          [IO.File]::WriteAllBytes("wpf/Assets/UntamedManager.ico",[Convert]::FromBase64String(($ico.content -replace '\s','')))
          if ((Get-Item "wpf/Assets/UntamedManager.ico").Length -lt 800) { throw "Icon file incomplete" }
      - name: Prepare ten original WPF map card artworks
        shell: pwsh
        run: |
          ./wpf/PrepareArtwork.ps1
      - name: Check source files
        shell: pwsh
        run: |
          if (!(Test-Path 'wpf/UntamedManager.csproj')) { throw "Missing WPF project" }
          if (!(Test-Path 'wpf/MainWindow.xaml')) { throw "Missing window" }
          if (!(Test-Path 'wpf/MainWindow.xaml.cs')) { throw "Missing codebehind" }
      - name: Compile WPF for Windows x64
        shell: pwsh
        run: |
          dotnet publish wpf/UntamedManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist --nologo
          if ($LASTEXITCODE -ne 0) { throw "WPF publish failed" }
          if (!(Test-Path "dist/UntamedManager.exe")) { throw "EXE not produced" }
          Get-Item "dist/UntamedManager.exe" | Select-Object Name,Length
          Get-FileHash "dist/UntamedManager.exe" -Algorithm SHA256
      - name: Build independent Windows updater
        shell: pwsh
        run: |
          dotnet publish wpf/Updater/UntamedUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o "$env:RUNNER_TEMP/untamed-updater" --nologo
          if ($LASTEXITCODE -ne 0) { throw "Updater publish failed" }
          Copy-Item "$env:RUNNER_TEMP/untamed-updater/UntamedUpdater.exe" "dist/UntamedUpdater.exe"
          if (!(Test-Path "dist/UntamedUpdater.exe")) { throw "Updater helper missing" }
      - name: Build and run independent read-only supervisor
        shell: pwsh
        run: |
          dotnet publish wpf/Supervisor/UntamedSupervisor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$env:RUNNER_TEMP/supervisor" --nologo
          if ($LASTEXITCODE -ne 0) { throw "Supervisor build failed" }
          Copy-Item "$env:RUNNER_TEMP/supervisor/UntamedSupervisor.exe" dist/UntamedSupervisor.exe
          & dist/UntamedSupervisor.exe --once --root "$env:RUNNER_TEMP/supervisor-profile"
          if ($LASTEXITCODE -ne 0) { throw "Supervisor run failed" }
          if (!(Test-Path "$env:RUNNER_TEMP/supervisor-profile/supervisor-heartbeat.json")) { throw "Missing independent heartbeat" }
      - name: Isolated Windows service lifecycle test
        shell: pwsh
        run: |
          $serviceName = "UntamedSupervisor-CI-$env:GITHUB_RUN_ID"
          $serviceRoot = Join-Path $env:RUNNER_TEMP "supervisor-service-profile"
          $workerExe = Join-Path $env:GITHUB_WORKSPACE "dist/UntamedSupervisor.exe"
          $binary = '"{0}" --service --service-name "{1}" --root "{2}"' -f $workerExe,$serviceName,$serviceRoot
          New-Service -Name $serviceName -BinaryPathName $binary -StartupType Manual | Out-Null
          try {
            Start-Service $serviceName
            Start-Sleep -Seconds 3
            if ((Get-Service $serviceName).Status -ne 'Running') { throw "Supervisor service failed" }
            Stop-Service $serviceName
            if ((Get-Service $serviceName).Status -ne 'Stopped') { throw "Supervisor service did not stop" }
          } finally {
            Stop-Service $serviceName -ErrorAction SilentlyContinue
            sc.exe delete $serviceName
          }
      - name: Windows two-Manager integration tests with fake server process
        shell: pwsh
        run: |
          dotnet publish wpf/Testing/FakeAsa/FakeAsa.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP/FakeAsa" --nologo
          if ($LASTEXITCODE -ne 0) { throw "FakeAsa fixture build failed" }
          dotnet run --project wpf/Testing/Integration/Integration.csproj -c Release -- "$env:RUNNER_TEMP/FakeAsa/FakeAsa.exe" "$env:GITHUB_WORKSPACE/dist/UntamedSupervisor.exe" "$env:GITHUB_WORKSPACE/dist/UntamedManager.exe"
          if ($LASTEXITCODE -ne 0) { throw "Two-manager LAN/process persistence tests failed" }
      - name: Windows runtime startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/dist/UntamedManager.exe" -ArgumentList "--smoke-test" -PassThru
          $finished = $p.WaitForExit(90000)
          $logDir = Join-Path $env:LOCALAPPDATA "UntamedManager/WPF"
          if (Test-Path "$logDir/smoke.log") { Get-Content "$logDir/smoke.log" }
          if (Test-Path "$logDir/crash.log") { Get-Content "$logDir/crash.log" -Tail 50 }
          if (-not $finished) { $p.Kill(); throw "WPF smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "WPF initialization failed with exit code $($p.ExitCode)" }
      - name: Render actual WPF dashboard screenshot
        shell: pwsh
        env:
          UNTAMED_SCREENSHOT_PATH: ${{ github.workspace }}/dist/UntamedManager-preview.png
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/dist/UntamedManager.exe" -ArgumentList "--screenshot-test" -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw "WPF screenshot render timeout" }
          if ($p.ExitCode -ne 0) { throw "WPF screenshot generation failed" }
          if (!(Test-Path "$env:UNTAMED_SCREENSHOT_PATH")) { throw "WPF screenshot output missing" }
          if ((Get-Item "$env:UNTAMED_SCREENSHOT_PATH").Length -lt 8000) { throw "WPF screenshot unexpectedly small" }
      - name: Archive actual rendered screenshot for visual QA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $imagePath = "$env:GITHUB_WORKSPACE/dist/UntamedManager-preview.png"
          $resource = "repos/$env:GITHUB_REPOSITORY/contents/previews/UntamedManager-1.3.3.png"
          $body = @{
            message = "Capture actual WPF 1.3.3 dashboard screenshot for approved visual QA"
            branch = "main"
            content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($imagePath))
          }
          $oldJson = gh api "$resource" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $old = $oldJson | ConvertFrom-Json
            $body.sha = $old.sha
          }
          $jsonPath = Join-Path $env:RUNNER_TEMP "wpf-preview.json"
          [IO.File]::WriteAllText($jsonPath,($body | ConvertTo-Json -Compress))
          gh api --method PUT "$resource" --input "$jsonPath" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot archive actual rendered screenshot" }
      - name: Publish compact actual screenshot for visual comparison
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Bitmap]::FromFile("$env:GITHUB_WORKSPACE/dist/UntamedManager-preview.png")
          $small = New-Object System.Drawing.Bitmap(1200,675)
          $gfx = [System.Drawing.Graphics]::FromImage($small)
          $gfx.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $gfx.DrawImage($source,0,0,1200,675)
          $jpeg = Join-Path $env:RUNNER_TEMP "UntamedManager-actual-small.jpg"
          $small.Save($jpeg,[System.Drawing.Imaging.ImageFormat]::Jpeg)
          $gfx.Dispose(); $small.Dispose(); $source.Dispose()
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($jpeg))
          $resource = "repos/$env:GITHUB_REPOSITORY/contents/previews/UntamedManager-1.3.3.b64.txt"
          $body = @{
            message = "Archive compact actual GUI screenshot for reference visual comparison"
            branch = "main"
            content = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($encoded))
          }
          $oldJson = gh api "$resource" 2>$null
          if ($LASTEXITCODE -eq 0) { $body.sha = ($oldJson | ConvertFrom-Json).sha }
          $jsonPath = Join-Path $env:RUNNER_TEMP "preview-transfer.json"
          [IO.File]::WriteAllText($jsonPath,($body | ConvertTo-Json -Compress))
          gh api --method PUT "$resource" --input "$jsonPath" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish visual QA transfer" }
      - name: Save verified GUI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.3.3-actual-screenshot
          path: dist/UntamedManager-preview.png
          if-no-files-found: error
      - name: Package complete portable test build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/UntamedManager.exe,dist/UntamedUpdater.exe,dist/UntamedSupervisor.exe -DestinationPath dist/UntamedManager-1.3.3-win-x64.zip
          Get-FileHash dist/UntamedManager-1.3.3-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  UntamedManager-1.3.3-win-x64.zip" } | Set-Content dist/SHA256SUMS.txt
      - name: Save Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.3.3-windows-x64
          path: |
            dist/UntamedManager.exe
            dist/UntamedUpdater.exe
            dist/UntamedSupervisor.exe
            dist/UntamedManager-1.3.3-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe missing" }
          & $iscc "wpf/installer/UntamedManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (!(Test-Path "dist/UntamedManager-1.3.3-SETUP.exe")) { throw "Windows setup missing" }
          Get-FileHash "dist/UntamedManager-1.3.3-SETUP.exe" -Algorithm SHA256
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.3.3-installer
          path: dist/UntamedManager-1.3.3-SETUP.exe
          if-no-files-found: error
      - name: Create test-only GitHub release
        if: ${{ false }} # P0 development: release remains gated until all implemented subsystems pass review.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.3.3-wpf-preview.1"
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.3.3.exe" "dist/UntamedManager-1.3.3-win-x64.zip" "dist/SHA256SUMS.txt" "dist/UntamedManager-preview.png#UntamedManager-preview.png" "dist/UntamedManager-1.3.3-SETUP.exe#UntamedManager-1.3.3-SETUP.exe" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.3.3.exe" "dist/UntamedManager-1.3.3-win-x64.zip" "dist/SHA256SUMS.txt" "dist/UntamedManager-preview.png#UntamedManager-preview.png" "dist/UntamedManager-1.3.3-SETUP.exe#UntamedManager-1.3.3-SETUP.exe" --target "$env:GITHUB_SHA" --title "Untamed Manager WPF v1.3.3 - Process Safety Preview" --prerelease --notes-file wpf/RELEASE-1.3.3.md --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
