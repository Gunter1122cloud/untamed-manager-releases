name: Legacy Store-v1 reference tests (manual, no release)

# The native WPF GUI is retired. Keep read-only Core regressions available
# without building, packaging, publishing or advertising another Manager.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-store-regression:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out shared Store-v1 reference Core
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read-only historical Store-v1 compatibility tests
        shell: pwsh
        run: |
          dotnet run --project wpf/Testing/StoreV1/StoreV1.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Historical Store-v1 regression failed" }
          Write-Output "Shared reference Core only. No WPF EXE, Setup, ZIP or release produced."
