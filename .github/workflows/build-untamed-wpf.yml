name: Untamed Manager WPF Windows Build
on:
  push:
    branches: [main]
    paths:
      - 'wpf/**'
      - '.github/workflows/build-untamed-wpf.yml'
  workflow_dispatch:
concurrency:
  group: untamed-wpf-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out WPF source
        uses: actions/checkout@v4
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore checked-in T-Rex artwork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force wpf/Assets | Out-Null
          $json = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/21f8154d985845935a30bac3a33914ab7c449575" | ConvertFrom-Json
          if ($json.encoding -ne "base64") { throw "Image blob not base64" }
          [IO.File]::WriteAllBytes("wpf/Assets/kingdom-hero.jpg",[Convert]::FromBase64String(($json.content -replace '\s','')))
          if ((Get-Item "wpf/Assets/kingdom-hero.jpg").Length -lt 1000) { throw "Image incomplete" }
          $atlas = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/0e482cc9b6389908588d11846789ec8fbd434320" | ConvertFrom-Json
          if ($atlas.encoding -ne "base64") { throw "Map atlas blob invalid" }
          [IO.File]::WriteAllBytes("wpf/Assets/map-atlas.jpg",[Convert]::FromBase64String(($atlas.content -replace '\s','')))
          if ((Get-Item "wpf/Assets/map-atlas.jpg").Length -lt 3000) { throw "Map atlas incomplete" }
          $ico=gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/7d6fa69a40eac8b7cf343e0f39223d776d4131c2" | ConvertFrom-Json
          if ($ico.encoding -ne "base64") { throw "Icon blob invalid" }
          [IO.File]::WriteAllBytes("wpf/Assets/UntamedManager.ico",[Convert]::FromBase64String(($ico.content -replace '\s','')))
          if ((Get-Item "wpf/Assets/UntamedManager.ico").Length -lt 800) { throw "Icon file incomplete" }
      - name: Check source files
        shell: pwsh
        run: |
          if (!(Test-Path 'wpf/UntamedManager.csproj')) { throw "Missing WPF project" }
          if (!(Test-Path 'wpf/MainWindow.xaml')) { throw "Missing window" }
          if (!(Test-Path 'wpf/MainWindow.xaml.cs')) { throw "Missing codebehind" }
      - name: Compile WPF for Windows x64
        shell: pwsh
        run: |
          dotnet publish wpf/UntamedManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist --nologo
          if ($LASTEXITCODE -ne 0) { throw "WPF publish failed" }
          if (!(Test-Path "dist/UntamedManager.exe")) { throw "EXE not produced" }
          Get-Item "dist/UntamedManager.exe" | Select-Object Name,Length
          Get-FileHash "dist/UntamedManager.exe" -Algorithm SHA256
      - name: Windows runtime startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/dist/UntamedManager.exe" -ArgumentList "--smoke-test" -PassThru
          $finished = $p.WaitForExit(90000)
          $logDir = Join-Path $env:LOCALAPPDATA "UntamedManager/WPF"
          if (Test-Path "$logDir/smoke.log") { Get-Content "$logDir/smoke.log" }
          if (Test-Path "$logDir/crash.log") { Get-Content "$logDir/crash.log" -Tail 50 }
          if (-not $finished) { $p.Kill(); throw "WPF smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "WPF initialization failed with exit code $($p.ExitCode)" }
      - name: Render actual WPF dashboard screenshot
        shell: pwsh
        env:
          UNTAMED_SCREENSHOT_PATH: ${{ github.workspace }}/dist/UntamedManager-preview.png
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/dist/UntamedManager.exe" -ArgumentList "--screenshot-test" -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw "WPF screenshot render timeout" }
          if ($p.ExitCode -ne 0) { throw "WPF screenshot generation failed" }
          if (!(Test-Path "$env:UNTAMED_SCREENSHOT_PATH")) { throw "WPF screenshot output missing" }
          if ((Get-Item "$env:UNTAMED_SCREENSHOT_PATH").Length -lt 8000) { throw "WPF screenshot unexpectedly small" }
      - name: Save verified GUI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.0.4-actual-screenshot
          path: dist/UntamedManager-preview.png
          if-no-files-found: error
      - name: Save Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.0.4-windows-x64
          path: dist/UntamedManager.exe
          if-no-files-found: error
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe missing" }
          & $iscc "wpf/installer/UntamedManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (!(Test-Path "dist/UntamedManager-1.0.4-SETUP.exe")) { throw "Windows setup missing" }
          Get-FileHash "dist/UntamedManager-1.0.4-SETUP.exe" -Algorithm SHA256
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: UntamedManager-WPF-v1.0.4-installer
          path: dist/UntamedManager-1.0.4-SETUP.exe
          if-no-files-found: error
      - name: Create test-only GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.4-wpf-preview.1"
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.0.4.exe" "dist/UntamedManager-preview.png#UntamedManager-preview.png" "dist/UntamedManager-1.0.4-SETUP.exe#UntamedManager-1.0.4-SETUP.exe" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$tag" "dist/UntamedManager.exe#UntamedManager-WPF-v1.0.4.exe" "dist/UntamedManager-preview.png#UntamedManager-preview.png" "dist/UntamedManager-1.0.4-SETUP.exe#UntamedManager-1.0.4-SETUP.exe" --target "$env:GITHUB_SHA" --title "Untamed Manager WPF v1.0.4 - Installer Fix" --prerelease --notes "Isolated Windows WPF desktop preview. No host agent installed. No live Kova Store writes. Test on a third Windows PC only." --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
