name: Chapter III Dropbox media transfer
on:
  push:
    branches: ['media/chapter-iii-sourcepack']
    paths: ['.github/workflows/chapter-iii-dropbox-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: github.ref == 'refs/heads/media/chapter-iii-sourcepack'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install archive and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full ffmpeg
      - name: Retrieve owner-provided Dropbox archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming originals transfer review
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 480 --silent --show-error 'https://www.dropbox.com/scl/fi/lugl6xoy955w2878aj52o/Nyersanyag.rar?rlkey=77pxuverijf1f6mrqd9536a95&dl=1' -o incoming/Nyersanyag.rar
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path("incoming/Nyersanyag.rar")
          assert p.stat().st_size==1726759801, f"Unexpected byte count: {p.stat().st_size}"
          with p.open("rb") as f: assert f.read(7)==b"Rar!\x1a\x07\x01" or p.open("rb").read(7)==b"Rar!\x1a\x07\x00", "Not RAR"
          print("Verified archive size:",p.stat().st_size)
          PY
      - name: Extract only video files
        shell: bash
        run: |
          set -euo pipefail
          7z l incoming/Nyersanyag.rar
          7z e -y -aou -ssc- -ooriginals incoming/Nyersanyag.rar '-ir!*.mp4' '-ir!*.mkv' '-ir!*.webm' '-ir!*.mov' '-ir!*.m4v' '-ir!*.avi'
          python3 - <<'PY'
          import pathlib, hashlib, json, subprocess, shutil
          root=pathlib.Path("originals")
          transfer=pathlib.Path("transfer")
          review=pathlib.Path("review")
          files=[p for p in sorted(root.iterdir()) if p.is_file() and not p.is_symlink() and p.suffix.lower() in {".mp4",".mkv",".webm",".mov",".m4v",".avi"}]
          assert files,"No video files in archive"
          cap=150_000_000
          rows=[]
          n=0
          for p in files:
              try:
                  info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(p)],timeout=60))
                  v=next(s for s in info["streams"] if s["codec_type"]=="video")
              except Exception as e:
                  print("INVALID MEDIA",p.name,str(e)); continue
              n+=1
              row={"original_name":p.name,"size_bytes":p.stat().st_size,"width":v.get("width"),"height":v.get("height"),"fps":v.get("avg_frame_rate"),"duration":info["format"].get("duration"),"parts":[]}
              h=hashlib.sha256()
              with p.open("rb") as src:
                  i=0
                  while True:
                      chunk=src.read(cap)
                      if not chunk:break
                      i+=1
                      h.update(chunk)
                      group=f"{n:02d}-{i:02d}"
                      folder=transfer/group
                      folder.mkdir()
                      filename=p.name if p.stat().st_size<=cap else f"video_{n:02d}.part{i:03d}"
                      (folder/filename).write_bytes(chunk)
                      row["parts"].append({"artifact":"ChapterIII_video_"+group,"file":filename,"bytes":len(chunk),"sha256":hashlib.sha256(chunk).hexdigest()})
              row["sha256"]=h.hexdigest()
              rows.append(row)
          assert rows,"No valid video files"
          (review/"MANIFEST.json").write_text(json.dumps({"files":rows,"note":"Original video bytes; concatenate each file's parts in listed order and verify SHA256. User-provided material; verify third-party reuse rights before publication."},indent=2,ensure_ascii=False))
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          # Build one directory per artifact; upload via GitHub artifact action below.
          # Merge small parts into numbered fixed batches without modifying bytes.
          batches=pathlib.Path("batches")
          b=0
          used=0
          for row in rows:
              for part in row["parts"]:
                  group=part["artifact"].removeprefix("ChapterIII_video_")
                  src=transfer/group/part["file"]
                  if b==0 or used+src.stat().st_size>180_000_000:
                      b+=1; used=0
                  dest=batches/f"{b:02d}"/group
                  dest.mkdir(parents=True,exist_ok=True)
                  shutil.move(src,dest/src.name)
                  used+=part["bytes"]
                  part["artifact"]=f"ChapterIII_originals_{b:02d}"
                  part["file"]=group+"/"+src.name
          assert b<=25,f"Too many batches: {b}"
          (review/"MANIFEST.json").write_text(json.dumps({"files":rows,"batch_count":b,"note":"Original bytes; concatenate parts in listed order and verify SHA256. User-provided material; verify third-party reuse rights before publication."},indent=2,ensure_ascii=False))
          print("VALID VIDEOS",len(rows),"BATCHES",b)
          PY
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: ChapterIII_Dropbox_Manifest
          path: review/
          if-no-files-found: error
          retention-days: 3
      - name: Upload original batch 01
        if: ${{ hashFiles('batches/01/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ChapterIII_originals_01
          path: batches/01/
          if-no-files-found: error
          compression-level: 0
