name: Obsidian Discord bot module tests
on:
  pull_request:
    paths:
      - 'scripts/obsidian_discord_*.py'
      - 'scripts/obsidian_discord_*.cjs'
      - 'scripts/test_obsidian_discord_status.cjs'
      - 'scripts/test_obsidian_discord_bot.py'
      - 'scripts/obsidian-discord-*.txt'
      - 'scripts/obsidian-discord-*.json'
      - '.github/workflows/discord-control-bot-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/obsidian-discord-requirements.txt
      - run: python -m py_compile scripts/obsidian_discord_client.py scripts/obsidian_discord_cog.py
      - run: python -m unittest discover -s scripts -p test_obsidian_discord_bot.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_obsidian_discord_status.cjs
